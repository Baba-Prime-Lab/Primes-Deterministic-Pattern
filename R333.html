<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaBa Twin Primes Engine - Unified Universal Scale 10^9</title>
    <style>
        :root { 
            --primary: #2c3e50; 
            --accent: #c0392b; 
            --success: #27ae60; 
            --bg: #f4f7f6; 
            --binance: #f3ba2f; 
            --purple: #a855f7;
        }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: var(--bg); 
            margin: 0; 
            color: #000; 
            text-align: center;
        }
        .nav-header { 
            width: 100%; 
            background: white; 
            padding: 10px 20px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            display: flex; 
            justify-content: flex-start; 
            gap: 10px; 
            box-sizing: border-box;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .home-btn { 
            text-decoration: none; 
            background: var(--accent); 
            color: white; 
            padding: 8px 15px; 
            border-radius: 5px; 
            font-weight: bold; 
            font-size: 0.9rem; 
            transition: 0.3s; 
        }
        .home-btn:hover { background: #a93226; transform: translateY(-1px); }

        .support-btn { 
            text-decoration: none; 
            background: var(--binance); 
            color: black; 
            padding: 8px 15px; 
            border-radius: 5px; 
            font-weight: bold; 
            font-size: 0.9rem; 
            transition: 0.3s; 
            border: 1px solid #d4a017;
        }
        .support-btn:hover { background: #d4a017; transform: translateY(-1px); }

        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .lab-ui { border: 2px solid #ddd; padding: 40px; border-radius: 15px; background: white; box-shadow: 0 6px 15px rgba(0,0,0,0.1); }
        h1 { color: var(--primary); margin-bottom: 5px; }
        
        .formula-box {
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            color: #334155;
            margin: 20px 0;
            border-left: 6px solid var(--purple);
            text-align: left;
            font-size: 0.95rem;
        }
        input { 
            width: 85%; 
            padding: 15px; 
            font-size: 1.8rem; 
            border: 3px solid var(--primary); 
            border-radius: 10px; 
            text-align: center; 
            font-weight: bold; 
            margin: 20px 0; 
            color: var(--accent); 
        }
        button {
            padding: 15px 35px;
            background: var(--purple);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(168, 85, 247, 0.3);
        }
        button:hover { background: #9333ea; transform: translateY(-1px); }
        
        .comparison-box {
            margin-top: 30px;
            padding: 25px;
            background: #f8fafc;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            display: flex;
            justify-content: space-around;
            text-align: left;
        }
        .box-col { flex: 1; padding: 0 15px; }
        .highlight { color: var(--purple); font-weight: bold; font-size: 1.8rem; }
        .notice { font-size: 14px; color: var(--purple); margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div class="nav-header">
    <a href="index.html" class="home-btn">🏠 Back to Home</a>
    <a href="support.html" class="support-btn">☕ Support Research</a>
</div>

<div class="container">
    <div class="lab-ui">
        <h1>BaBa Twin Primes Engine</h1>
        <h3>Universal Constant Sieve - Memory Optimized up to 10^9</h3>
        
        <div class="formula-box">
            <strong>Universal Pure Rule:</strong> T(x) = π(x) × [π(p)/p] × 0.625 <br>
            <span style="font-size:12px; color:#64748b;">Enforcing the invariant fractional constant (5/8) globally across all numerical territories.</span>
        </div>

        <label style="font-weight:bold; font-size:1.1rem;">Enter Range (X):</label><br>
        <input type="number" id="inputValue" value="1000000" max="1000000000"><br>
        <button onclick="executeBabaTwins()">Compute Twins</button>

        <div id="resultsArea"></div>
    </div>
</div>

<script>
const UNIVERSAL_CONSTANT = 0.625000000;

function computeLocalPiX(X) {
    let sieve = new Uint8Array(X + 1);
    sieve.fill(1); if(X >= 0) sieve[0] = 0; if(X >= 1) sieve[1] = 0;
    for (let i = 2; i * i <= X; i++) {
        if (sieve[i]) { for (let j = i * i; j <= X; j += i) sieve[j] = 0; }
    }
    let count = 0;
    for (let i = 2; i <= X; i++) { if (sieve[i]) count++; }
    return count;
}

function computePiXAtScale(X) {
    let limit = Math.floor(Math.sqrt(X));
    let isPrimeBase = new Uint8Array(limit + 1);
    isPrimeBase.fill(1); isPrimeBase[0] = 0; isPrimeBase[1] = 0;
    for (let i = 2; i * i <= limit; i++) {
        if (isPrimeBase[i]) { for (let j = i * i; j <= limit; j += i) isPrimeBase[j] = 0; }
    }
    let primes = [];
    for (let i = 2; i <= limit; i++) { if (isPrimeBase[i]) primes.push(i); }

    let count = 0, segmentSize = 500000, segment = new Uint8Array(segmentSize);
    for (let low = 2; low <= X; low += segmentSize) {
        let high = Math.min(low + segmentSize - 1, X);
        segment.fill(1);
        for (let i = 0; i < primes.length; i++) {
            let p = primes[i];
            let start = Math.max(p * p, Math.floor((low + p - 1) / p) * p);
            for (let j = start; j <= high; j += p) segment[j - low] = 0;
        }
        for (let j = low; j <= high; j++) { if (segment[j - low]) count++; }
    }
    return count;
}

function getSieveData(X) {
    let pi_X = (X < 1000) ? computeLocalPiX(X) : computePiXAtScale(X);
    let limit = Math.floor(Math.sqrt(X));
    let bladesSieve = new Uint8Array(limit + 1);
    bladesSieve.fill(1); if(limit >= 0) { bladesSieve[0] = 0; if(limit >= 1) bladesSieve[1] = 0; }
    for (let i = 2; i * i <= limit; i++) {
        if (bladesSieve[i]) { for (let j = i * i; j <= limit; j += i) bladesSieve[j] = 0; }
    }
    let p = 2, pi_p = 0;
    for (let i = 2; i <= limit; i++) { if (bladesSieve[i]) { p = i; pi_p++; } }
    
    // Smooth boundary handling for the early structural stages
    if (X >= 10 && X <= 24) { p = 3; pi_p = 2; }
    else if (X >= 25 && X <= 48) { p = 5; pi_p = 3; }
    else if (X >= 49 && X <= 66) { p = 7; pi_p = 4; }

    return { pi_X, p, pi_p };
}

function executeBabaTwins() {
    const X = parseInt(document.getElementById('inputValue').value);
    if (isNaN(X) || X < 2) {
        alert('Please enter an integer greater than 1');
        return;
    }

    document.getElementById('resultsArea').innerHTML = '<p class="notice">⚙️ Computing continuous density via Universal Constant... Processing...</p>';

    setTimeout(() => {
        let startTime = performance.now();
        let pi_X, p, pi_p, rawT;
        
        if (X < 4) {
            pi_X = (X === 2) ? 1 : 2; p = 2; pi_p = 1; rawT = 0.0000;
        } else {
            let data = getSieveData(X);
            pi_X = data.pi_X; p = data.p; pi_p = data.pi_p;
            rawT = pi_X * (pi_p / p) * UNIVERSAL_CONSTANT;
        }

        let endTime = performance.now();
        let executionTime = ((endTime - startTime) / 1000).toFixed(3);

        document.getElementById('resultsArea').innerHTML = `
            <div class="comparison-box">
                <div class="box-col" style="border-right: 2px solid #e2e8f0;">
                    <p style="color: #38bdf8; font-weight: bold; margin-bottom: 10px;">⚙️ Sieve Foundations:</p>
                    <p style="margin:5px 0;">Net Primes π(X): <b>${pi_X.toLocaleString()}</b></p>
                    <p style="margin:5px 0;">Active Root Blade (p): <b>${p}</b></p>
                    <p style="margin:5px 0;">Blade Order π(p): <b>${pi_p}</b></p>
                    <p style="margin:5px 0;">Universal Ratio C(x): <span style="color:#34d399; font-weight:bold;">${UNIVERSAL_CONSTANT.toFixed(9)}</span></p>
                </div>
                <div class="box-col">
                    <p style="color: var(--purple); font-weight: bold; margin-bottom: 10px;">🔮 Predicted Twin Density T(X):</p>
                    <p>Continuous Weight: <span class="highlight">${rawT.toFixed(4)}</span></p>
                    <p style="font-size:12px; color:#64748b; margin-top:35px;">
                        Computation completed in ${executionTime} sec (Universal Core).
                    </p>
                </div>
            </div>`;
    }, 50);
}
window.onload = executeBabaTwins;
</script>
</body>
</html>
